services:
  warehouse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: warehousedb
    ports:
      - "5432:5432"
    volumes:
      - ./db/seed_warehouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d warehousedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  source-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: sourcedb
    ports:
      - "5433:5432"

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - WAREHOUSE_DB_URL=postgresql+asyncpg://user:${POSTGRES_PASSWORD:-password}@warehouse-db:5432/warehousedb
      - SOURCE_DB_URL=postgresql+asyncpg://user:${POSTGRES_PASSWORD:-password}@source-db:5432/sourcedb
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MOCK_AI=${MOCK_AI}
      - ENVIRONMENT=development
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-conduit_graph_2026}
    volumes:
      - ./backend:/app
      - ./run_checks.py:/app/run_checks.py
      - tmp_data:/tmp
    depends_on:
      warehouse-db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/conduit_graph_2026
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p conduit_graph_2026 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tmp_data:

